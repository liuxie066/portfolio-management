name: Quality Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Validate pinned and published contracts
        run: |
          python -m scripts.export_om_openapi --check
          python -m pytest -q \
            tests/test_quality_status_contract_vendor.py \
            tests/test_quality_document_ownership.py \
            tests/test_om_openapi_contract.py \
            tests/test_om_api_contract_release.py
